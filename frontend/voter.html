<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數位投票系統</title>
    <!-- Favicon -->
    <link rel="icon" href="assets/logo.png" type="image/png">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        .container {
            max-width: 600px;
            padding: 15px;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            /* overflow: hidden; 移除，避免候選人下拉選單被截斷 */
        }
        /* 補上圓角設定，取代原本 card 的 overflow: hidden 效果 */
        .card-header, .header-banner {
            border-top-left-radius: 15px !important;
            border-top-right-radius: 15px !important;
        }
        .card-footer {
            border-bottom-left-radius: 15px !important;
            border-bottom-right-radius: 15px !important;
        }
        .header-banner {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white;
            padding: 20px 15px;
            text-align: center;
        }
        .header-banner h4 {
            margin: 0;
            font-weight: bold;
        }
        /* Auth View */
        #view-auth .key-input {
            font-size: 2rem;
            text-align: center;
            letter-spacing: 5px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
        }
        /* Ballot View */
        .candidate-search-box {
            position: relative;
        }
        .candidate-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ced4da;
            border-radius: 0 0 10px 10px;
            max-height: 350px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        .candidate-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .candidate-item:hover {
            background-color: #f8f9fa;
        }
        .candidate-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #e9ecef;
        }
        .selected-candidate {
            background: #e7f1ff;
            border: 1px solid #0d6efd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        /* View transitions */
        .view-section {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .view-section.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container mt-3">
    
    <!-- 載入中畫面 -->
    <div id="loader" class="text-center py-5">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
        <p class="mt-3 text-muted fw-bold">系統連線中...</p>
    </div>

    <!-- 視圖 1: 登入 (驗證金鑰) -->
    <div id="view-auth" class="view-section">
        <div class="card">
            <div class="header-banner">
                <h4><i class="fas fa-vote-yea"></i> 教會數位選舉系統</h4>
                <p class="mb-0 mt-1 opacity-75">安全、匿名、即時</p>
            </div>
            <div class="card-body p-4 text-center">
                <h5 class="mb-3 text-primary"><i class="fas fa-key"></i> 請輸入您的選票金鑰</h5>
                <p class="text-muted small mb-4">金鑰為8碼數字，請參考您拿到的實體選票。</p>
                
                <input type="tel" id="keyInput" class="form-control key-input mb-4" placeholder="12345678" maxlength="8">
                
                <button class="btn btn-primary btn-lg w-100 fw-bold rounded-pill" id="btnVerifyKey">
                    進入投票 <i class="fas fa-arrow-right ms-1"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 視圖 2: 選票畫面 -->
    <div id="view-ballot" class="view-section">
        <div class="card border-primary">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="m-0" id="ballotElectionName">選舉名稱</h4>
                <h5 class="m-0 mt-2 text-warning fw-bold" id="ballotItemRoundName">項次 - 輪次</h5>
            </div>
            <div class="card-body">
                <div class="alert alert-info py-2 mb-4 text-center">
                    <i class="fas fa-info-circle"></i> 本輪次應選名額：<strong class="fs-5 text-danger" id="ballotQuota">0</strong> 名
                    <div id="ballotDistrictRule" class="small mt-1 text-danger fw-bold" style="display:none;">(含強制分區限制)</div>
                </div>

                <div id="ballotSelectionsContainer">
                    <!-- 動態產生的搜尋與選擇框 -->
                </div>

            </div>
            <div class="card-footer bg-white p-3">
                <button class="btn btn-success btn-lg w-100 fw-bold rounded-pill shadow-sm" id="btnSubmitVote">
                    <i class="fas fa-paper-plane"></i> 確認送出選票
                </button>
            </div>
        </div>
    </div>

    <!-- 視圖 3: 等候大廳與開票結果 -->
    <div id="view-waiting" class="view-section">
        <div class="card text-center">
            <div class="card-body py-5">
                <div id="waitStatusIcon" class="mb-3">
                    <i class="fas fa-check-circle text-success" style="font-size: 5rem;"></i>
                </div>
                <h3 class="fw-bold text-success mb-2" id="waitTitle">投票成功！</h3>
                <p class="text-muted" id="waitSubtitle">您的選票已安全送出，請靜候開票。</p>
                <hr>
                
                <div id="liveResultSection" style="display: none;">
                    <h5 class="fw-bold text-primary mb-3"><i class="fas fa-bullhorn"></i> 本輪開票結果</h5>
                    <div class="list-group text-start" id="liveResultList">
                        <!-- 開票結果動態顯示 -->
                    </div>
                </div>
                
                <div id="waitSpinner" class="mt-4">
                    <div class="spinner-grow text-primary" role="status"></div>
                    <div class="spinner-grow text-success" role="status"></div>
                    <div class="spinner-grow text-info" role="status"></div>
                    <p class="text-muted mt-2 small">等待大會發布結果中...</p>
                </div>
            </div>
            <div class="card-footer bg-white">
                <button class="btn btn-outline-primary w-100" onclick="location.reload()">重新整理 / 回首頁</button>
            </div>
        </div>
    </div>

</div>

<!-- Tutorial Overlay (Advanced 8 Steps) -->
<div id="advancedTutorialOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; padding: 15px; overflow-y: auto;">
    
    <!-- Tooltip / Dialogue Bubble -->
    <div id="tutorialTooltip" style="background: #ffc107; color: #000; padding: 15px; border-radius: 12px; margin-bottom: 15px; font-weight: bold; font-size: 1.1rem; width: 100%; max-width: 600px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: relative; animation: fadeIn 0.3s; z-index: 10000;">
        <i class="fas fa-chalkboard-teacher"></i> <span id="tutorialTooltipText">如何選擇候選人？</span>
    </div>

    <!-- The Mock Ballot UI -->
    <div id="mockBallotCard" class="card" style="width: 100%; max-width: 600px; box-shadow: 0 0 25px rgba(255,255,255,0.2); transition: all 0.3s; border-radius: 15px;">
        <!-- Header -->
        <div class="header-banner" style="background: #0d6efd; color: white; padding: 20px 15px; text-align: center; border-top-left-radius: 15px; border-top-right-radius: 15px;">
            <h4 style="margin: 0; font-weight: bold;">TEST</h4>
            <h5 style="margin: 5px 0 0 0; color: #ffc107;">投票練習教學</h5>
        </div>
        
        <div class="card-body p-3">
            <div class="alert alert-info text-center fw-bold" style="background-color: #e0f7fa; border: none; color: #006064;">
                <i class="fas fa-info-circle"></i> 本輪次應選名額：<span class="text-danger fs-5 mx-1">1</span> 名
            </div>

            <div class="mb-3" style="position: relative;">
                <label class="form-label fw-bold text-secondary">圈選欄 1</label>
                
                <!-- Step 1 & 4 Start Learning Button Overlay -->
                <div id="tutorialStartBtnOverlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; z-index: 10;">
                    <button id="btnTutorialNext" class="btn btn-warning fw-bold shadow-sm" style="width: 100%; font-size: 1.1rem;"><i class="fas fa-play-circle"></i> 開始學習</button>
                </div>

                <div class="input-group input-group-lg candidate-search-box shadow-sm" id="mockSearchGroup" style="border: 2px solid transparent; border-radius: 8px;">
                    <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                    <input type="text" id="mockSearchInput" class="form-control" placeholder="輸入號碼/姓名/分區搜尋..." readonly style="background: #fff; cursor: pointer;">
                </div>
                
                <!-- Mock Dropdown -->
                <div class="candidate-dropdown shadow-lg" id="mockDropdown" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ced4da; border-radius: 0 0 8px 8px; z-index: 1050; max-height: 250px; overflow-y: auto;">
                    <div id="mockCandidateList">
                        <!-- Filled dynamically by JS -->
                    </div>
                </div>
            </div>

            <!-- Submit Button (Disabled until step 8) -->
            <button id="mockSubmitBtn" class="btn btn-success btn-lg w-100 fw-bold shadow mt-3" disabled style="opacity: 0.6; transition: 0.3s; border-radius: 50px;">
                <i class="fas fa-paper-plane"></i> 確認送出選票
            </button>
        </div>
    </div>
    
    <!-- Final Success Overlay -->
    <div id="tutorialFinalSuccess" style="display: none; width: 100%; max-width: 500px; background: white; border-radius: 15px; padding: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: fadeIn 0.5s;">
        <i class="fas fa-check-circle text-success" style="font-size: 5rem; margin-bottom: 15px;"></i>
        <h3 class="text-success fw-bold">太棒了！</h3>
        <p class="text-muted fs-5 mt-2">您已經完全學會投票操作囉！<br><strong class="text-danger">即將進入正式投票頁面，請注意正式投票點選後無法重來。</strong></p>
    </div>
</div>
<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { initializeFirestore, doc, getDoc, collection, query, where, getDocs, writeBatch, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyABw9ATwX7E0YxtkM4PK_YCpAEH98X0nBs",
        authDomain: "church-election-system-7c674.firebaseapp.com",
        projectId: "church-election-system-7c674",
        storageBucket: "church-election-system-7c674.firebasestorage.app",
        messagingSenderId: "107251562289",
        appId: "1:107251562289:web:a9cd450302d7c235aa6210"
    };

    const app = initializeApp(firebaseConfig);
    // 強制使用 Long Polling，避免手機 WebView 的 WebSocket 連線超時等待 30 秒
    const db = initializeFirestore(app, {
        experimentalForceLongPolling: true
    });

    window.firebaseDb = db;
    window.fs = {
        doc, getDoc, collection, query, where, getDocs, writeBatch, serverTimestamp, onSnapshot
    };
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- 本機 JS -->
<script src="voter.js?v=1.4"></script>

</body>
</html>
